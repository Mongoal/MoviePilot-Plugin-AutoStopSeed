name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: 单元测试（独立，无后端）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=7.0"

      - name: 语法编译检查
        run: |
          python -m py_compile plugins.v2/autostopseed/__init__.py
          python -m py_compile tests/conftest.py
          python -m py_compile tests/v2/autostopseed/test_autostopseed.py

      - name: 运行 pytest（完全独立，不依赖 MoviePilot 后端）
        run: python -m pytest tests/ -v
