[project]
name = "moviepilot-plugin-autostopseed"
version = "1.0.0"
description = "MoviePilot V2 插件：整理完成后自动停止 MoviePilot 创建种子的做种。"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "AutoStopSeed" }]
requires-python = ">=3.10"
keywords = ["moviepilot", "plugin", "torrent", "seeding", "qbittorrent", "transmission"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet",
]

# 本项目无可运行依赖：插件运行依赖 MoviePilot 宿主；测试仅需 pytest
[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
# 与仓库根 pytest.ini 保持一致；这里作为 pyproject 原生配置的兜底
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
